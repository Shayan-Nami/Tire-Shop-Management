components:
  schemas:
    Brand:
      type: object
      properties:
        brand_id:
          type: integer
          readOnly: true
        brand_name:
          type: string
          title: نام برند
          maxLength: 50
        tires_count:
          type: integer
          readOnly: true
      required:
      - brand_id
      - brand_name
      - tires_count
    ChangePassword:
      type: object
      description: سریالایزر تغییر رمز عبور توسط خود کاربر
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - old_password
    CustomTokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    CustomTokenRefresh:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    Customer:
      type: object
      properties:
        customer_id:
          type: integer
          readOnly: true
        full_name:
          type: string
          title: نام و نام خانوادگی
          maxLength: 100
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        national_code:
          type: string
          nullable: true
          maxLength: 10
        address:
          type: string
          nullable: true
          title: آدرس
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ ثبت
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ آخرین ویرایش
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
          readOnly: true
      required:
      - created_at
      - customer_id
      - full_name
      - updated_at
      - vehicles
    CustomerRefundVoucher:
      type: object
      properties:
        refund_id:
          type: integer
          readOnly: true
        refund_date:
          type: string
          format: date-time
          title: تاریخ استرداد وجه
        jalali_date:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        sales_invoice:
          type: integer
          title: فاکتور فروش مربوطه
        sales_return:
          type: integer
          nullable: true
          title: سند مرجوعی عطف
        customer_name:
          type: string
          title: نام و نام خانوادگی
          readOnly: true
        payment_method:
          type: string
          title: روش استرداد
          maxLength: 50
        reference_number:
          type: string
          nullable: true
          title: شماره پیگیری / مرجع
          maxLength: 100
        notes:
          type: string
          title: توضیحات سند
        created_by:
          type: integer
          readOnly: true
          nullable: true
          title: کاربر صادرکننده
        created_by_name:
          type: string
          title: نام و نام خانوادگی
          readOnly: true
        is_cancelled:
          type: boolean
          readOnly: true
          title: ابطال شده
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: تاریخ و زمان ابطال
        cancelled_by:
          type: integer
          readOnly: true
          nullable: true
          title: کاربر ابطال‌کننده
        cancelled_by_name:
          type: string
          title: نام و نام خانوادگی
          readOnly: true
        cancellation_reason:
          type: string
          readOnly: true
          title: علت ابطال
      required:
      - amount
      - cancellation_reason
      - cancelled_at
      - cancelled_by
      - cancelled_by_name
      - created_by
      - created_by_name
      - customer_name
      - is_cancelled
      - jalali_date
      - refund_id
      - sales_invoice
    DashboardStatsResponse:
      type: object
      properties:
        today_revenue:
          type: number
          format: double
          description: مبلغ فروش امروز به ریال/تومان
        today_invoices_count:
          type: integer
          description: تعداد فاکتورهای امروز
        total_receivables:
          type: number
          format: double
          description: مجموع مطالبات و فاکتورهای نسیه
        unpaid_invoices_count:
          type: integer
          description: تعداد فاکتورهای تسویه نشده
        total_inventory_value:
          type: number
          format: double
          description: ارزش ریالی کل انبار
        total_tires_stock:
          type: integer
          description: تعداد کل لاستیک‌های موجود در انبار
        low_stock_count:
          type: integer
          description: تعداد اقلام تایر زیر حد هشدار
      required:
      - low_stock_count
      - today_invoices_count
      - today_revenue
      - total_inventory_value
      - total_receivables
      - total_tires_stock
      - unpaid_invoices_count
