    Logout:
      type: object
      description: سریالایزر خروج و ابطال توکن
      properties:
        refresh:
          type: string
          description: توکن تجدید (Refresh Token) جهت قرارگیری در لیست سیاه
      required:
      - refresh
    MovementTypeEnum:
      enum:
      - INITIAL_STOCK
      - PURCHASE
      - PURCHASE_CANCEL
      - SALE
      - SALE_CANCEL
      - SALE_RETURN
      - MANUAL_ADJUSTMENT
      type: string
      description: |-
        * `INITIAL_STOCK` - موجودی اولیه
        * `PURCHASE` - ورود - خرید
        * `PURCHASE_CANCEL` - خروج - لغو خرید
        * `SALE` - خروج - فروش
        * `SALE_CANCEL` - ورود - لغو فروش
        * `SALE_RETURN` - ورود - مرجوعی از فروش
        * `MANUAL_ADJUSTMENT` - اصلاح دستی / انبارگردانی
