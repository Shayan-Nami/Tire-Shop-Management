          type: string
        size_name:
          type: string
        stock_quantity:
          type: integer
        purchase_price:
          type: number
          format: double
        inventory_value:
          type: number
          format: double
      required:
      - brand_name
      - inventory_value
      - purchase_price
      - size_name
      - stock_quantity
      - tire_id
      - tire_name
