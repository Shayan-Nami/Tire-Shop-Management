openapi: 3.0.3
info:
  title: سامانه مدیریت فروشگاه لاستیک - API Documentation
  version: 2.0.0
  description: مستندات تعاملی وب‌سرویس‌های سیستم مدیریت فروشگاه، انبار و خدمات لاستیک
    برای وب و موبایل
paths:
  /api/v1/analytics/dashboard-stats/:
    get:
      operationId: v1_analytics_dashboard_stats_retrieve
      description: آمار کلی و شاخص‌های کلیدی عملکرد (KPI) جهت نمایش در کارت‌های داشبورد
        اصلی با لحاظ مرجوعی‌ها
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
          description: ''
  /api/v1/analytics/inventory-value/:
    get:
      operationId: v1_analytics_inventory_value_retrieve
      description: گزارش ارزش ریالی موجودی انبار بر اساس قیمت خرید
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryValueResponse'
          description: ''
  /api/v1/analytics/profitability/:
    get:
      operationId: v1_analytics_profitability_list
      description: گزارش سودآوری تایرها بر اساس مابه‌التفاوت نرخ خرید و فروش با کسر
        مرجوعی‌ها و احتساب تخفیف فاکتور
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfitabilityItem'
          description: ''
  /api/v1/analytics/sales-by-brand/:
    get:
      operationId: v1_analytics_sales_by_brand_list
      description: گزارش تفکیکی فروش بر اساس برندهای لاستیک با کسر مرجوعی‌ها
      parameters:
      - in: query
        name: brand_id
        schema:
          type: integer
          nullable: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
