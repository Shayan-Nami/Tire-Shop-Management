  /api/v1/catalog/stock-movements/:
    get:
      operationId: v1_catalog_stock_movements_list
      description: |-
        دفتر گردش انبار (کاملاً فقط‌خواندنی بدون امکان ویرایش، حذف یا ایجاد مستقیم)
        دسترسی منحصراً برای انباردار و مدیر مجاز است؛ تکنسین خطای ۴۰۳ دریافت می‌کند.
      parameters:
      - in: query
        name: movement_type
        schema:
          type: string
          title: نوع گردش انبار
          enum:
          - INITIAL_STOCK
          - MANUAL_ADJUSTMENT
          - PURCHASE
          - PURCHASE_CANCEL
          - SALE
          - SALE_CANCEL
          - SALE_RETURN
        description: |-
          * `INITIAL_STOCK` - موجودی اولیه
          * `PURCHASE` - ورود - خرید
          * `PURCHASE_CANCEL` - خروج - لغو خرید
          * `SALE` - خروج - فروش
          * `SALE_CANCEL` - ورود - لغو فروش
          * `SALE_RETURN` - ورود - مرجوعی از فروش
          * `MANUAL_ADJUSTMENT` - اصلاح دستی / انبارگردانی
      - name: ordering
        required: false
        in: query
        description: کدام فیلد باید هنگام مرتب‌سازی نتایج استفاده شود.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - in: query
        name: purchase_invoice
        schema:
          type: integer
      - in: query
        name: sales_invoice
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      - in: query
        name: tire
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStockMovementList'
          description: ''
