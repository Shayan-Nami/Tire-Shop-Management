    body {
      margin: 0;

      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 600; color: #38bdf8; }
    .controls { display: flex; gap: 8px; align-items: center; }
    button, a.btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 7px 15px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover, a.btn:hover { background: #475569; border-color: #64748b; }
    .btn-primary { background: #0284c7; border-color: #0369a1; }
    .btn-primary:hover { background: #0369a1; }
    #viewport {
      flex: 1;
      overflow: hidden;
      cursor: grab;
      position: relative;
      background-image: radial-gradient(#334155 1.5px, transparent 1.5px);
      background-size: 28px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #viewport:active { cursor: grabbing; }
    #container {
      transform-origin: center center;
      transition: transform 0.05s ease-out;
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    svg { display: block; }
  </style>

    </div>
  </div>
  <script>
    let scale = 0.52;
    let pointX = 0;
    let pointY = 0;
    let start = { x: 0, y: 0 };
    let panning = false;
    const viewport = document.getElementById('viewport');
    const container = document.getElementById('container');

    function update() {
      container.style.transform = 'translate(' + pointX + 'px, ' + pointY + 'px) scale(' + scale + ')';
    }

    function zoom(factor) {
      scale = Math.min(Math.max(0.1, scale * factor), 4);
      update();
    }

    function resetZoom() {
      scale = 0.52;
      pointX = 0;
      pointY = 0;
      update();
    }

    viewport.onmousedown = function(e) {
      if (e.target.closest('button') || e.target.closest('a')) return;
      e.preventDefault();
      start = { x: e.clientX - pointX, y: e.clientY - pointY };
      panning = true;
    };

    window.onmouseup = function() {
      panning = false;
    };

    window.onmousemove = function(e) {
      if (!panning) return;
      pointX = (e.clientX - start.x);
      pointY = (e.clientY - start.y);
      update();
    };

    viewport.onwheel = function(e) {
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale;
      const ys = (e.clientY - pointY) / scale;
      const delta = -e.deltaY;
      const factor = (delta > 0) ? 1.1 : 0.9;
      scale = Math.min(Math.max(0.1, scale * factor), 4);
      pointX = e.clientX - xs * scale;
      pointY = e.clientY - ys * scale;
      update();
    };

    update();
  </script>
