name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tire_shop_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DJANGO_SECRET_KEY: ci-only-disposable-signing-key-not-for-deployment
      DJANGO_DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: postgres
      DB_NAME: tire_shop_ci
      DB_USER: postgres
      DB_PASSWORD: ci-only-disposable-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      USE_SQL_SERVER: 'False'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: npm ci
        working-directory: frontend
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file "$RUNNER_TEMP/openapi.yml"
      - run: python manage.py migrate --noinput
      - run: python manage.py migrate --check
      - name: PostgreSQL tests and frontend contract integration
        run: python -m pytest --ds=config.settings
      - name: Isolated SQLite tests and frontend contract integration
        run: python -m pytest --ds=config.verification_settings
